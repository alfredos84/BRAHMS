<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow-pump" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-signal" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-idler" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="crystalFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d52a0;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#1a237e;stop-opacity:0.95"/>
    </linearGradient>
    <linearGradient id="crystalTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5c6bc0;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#3949ab;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="crystalRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#283593;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#0d1b6e;stop-opacity:0.95"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:1"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" rx="72"/>

  <!-- Crystal: front face -->
  <polygon points="148,152 340,152 340,360 148,360"
           fill="url(#crystalFront)" stroke="#7986cb" stroke-width="2.5" opacity="0.92"/>
  <!-- Crystal: top face -->
  <polygon points="148,152 340,152 390,102 198,102"
           fill="url(#crystalTop)" stroke="#7986cb" stroke-width="2"/>
  <!-- Crystal: right face -->
  <polygon points="340,152 390,102 390,310 340,360"
           fill="url(#crystalRight)" stroke="#5c6bc0" stroke-width="2"/>

  <!-- Interior glow (beam inside crystal) -->
  <line x1="148" y1="256" x2="340" y2="256" stroke="#ff6d00" stroke-width="5" opacity="0.15"/>

  <!-- Facet highlight lines -->
  <line x1="148" y1="152" x2="148" y2="360" stroke="#9fa8da" stroke-width="0.8" opacity="0.4"/>
  <line x1="340" y1="152" x2="340" y2="360" stroke="#9fa8da" stroke-width="0.8" opacity="0.4"/>
  <line x1="148" y1="256" x2="340" y2="256" stroke="#9fa8da" stroke-width="0.5" opacity="0.2"/>

  <!-- PPLN domain lines (vertical, inside crystal) -->
  <line x1="188" y1="152" x2="188" y2="360" stroke="#5c6bc0" stroke-width="1" opacity="0.35"/>
  <line x1="228" y1="152" x2="228" y2="360" stroke="#5c6bc0" stroke-width="1" opacity="0.35"/>
  <line x1="268" y1="152" x2="268" y2="360" stroke="#5c6bc0" stroke-width="1" opacity="0.35"/>
  <line x1="308" y1="152" x2="308" y2="360" stroke="#5c6bc0" stroke-width="1" opacity="0.35"/>

  <!-- PUMP beam (orange/red, enters from left) -->
  <line x1="18" y1="256" x2="144" y2="256"
        stroke="#ff6d00" stroke-width="9" stroke-linecap="round"
        filter="url(#glow-pump)"/>
  <polygon points="128,243 150,256 128,269" fill="#ff6d00" filter="url(#glow-pump)"/>

  <!-- SIGNAL beam (green, exits upper right) -->
  <line x1="342" y1="256" x2="488" y2="148"
        stroke="#00e676" stroke-width="8" stroke-linecap="round"
        filter="url(#glow-signal)"/>
  <polygon points="466,137 491,145 476,165" fill="#00e676" filter="url(#glow-signal)"/>

  <!-- IDLER beam (cyan/blue, exits lower right) -->
  <line x1="342" y1="256" x2="488" y2="364"
        stroke="#40c4ff" stroke-width="8" stroke-linecap="round"
        filter="url(#glow-idler)"/>
  <polygon points="466,348 491,367 472,380" fill="#40c4ff" filter="url(#glow-idler)"/>

  <!-- ω label on pump -->
  <text x="52" y="236" font-family="Georgia, serif" font-style="italic"
        font-size="36" fill="#ff6d00" opacity="0.95" filter="url(#glow-pump)">ω</text>

  <!-- 2ω label on signal -->
  <text x="440" y="136" font-family="Georgia, serif" font-style="italic"
        font-size="30" fill="#00e676" opacity="0.95" filter="url(#glow-signal)">2ω</text>

  <!-- ω' label on idler -->
  <text x="444" y="400" font-family="Georgia, serif" font-style="italic"
        font-size="30" fill="#40c4ff" opacity="0.95" filter="url(#glow-idler)">ω'</text>
</svg>
